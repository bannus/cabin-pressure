<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cabin Pressure Debugger</title>
    <link rel="stylesheet" href="debugger.css" />
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Milestone 8</p>
        <h1>Cabin Pressure Debugger</h1>
      </div>
      <div class="controls" aria-label="simulation controls">
        <label>
          Config
          <select id="configPicker"></select>
        </label>
        <label>
          Seed
          <input id="seedInput" type="number" min="1" step="1" />
        </label>
        <button id="playPause" type="button">Pause</button>
        <label>
          Speed
          <select id="speed">
            <option value="1">1x</option>
            <option value="2" selected>2x</option>
            <option value="5">5x</option>
            <option value="10">10x</option>
          </select>
        </label>
        <button id="step" type="button">Step</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </header>

    <main>
      <section class="panel cabin-panel">
        <div class="panel-heading">
          <h2>Cabin</h2>
          <p id="clock"></p>
        </div>
        <div id="cabin" class="cabin" aria-label="schematic cabin grid"></div>
      </section>

      <aside class="panel sidebar">
        <section>
          <h2>Selected passenger</h2>
          <div id="selectedPassenger" class="selected-passenger">Select a passenger.</div>
          <div id="assignmentButtons" class="assignment-buttons"></div>
        </section>

        <section>
          <h2>Debug actions</h2>
          <div class="debug-buttons" aria-label="debug actions">
            <button id="startCart" type="button">Start cart</button>
            <button id="startTurbulence" type="button">Start turbulence</button>
            <button id="forceDiaper" type="button">Force diaper</button>
            <button id="fillSelected" type="button">Fill selected</button>
            <button id="emptySelected" type="button">Empty selected</button>
            <button id="assignNeediest" type="button">Assign neediest</button>
          </div>
        </section>

        <section>
          <h2>Playtest summary</h2>
          <div id="summary" class="selected-passenger"></div>
        </section>

        <section>
          <h2>Passenger watchlist</h2>
          <div id="watchlist" class="watchlist"></div>
        </section>

        <section>
          <h2>Lavatory queues</h2>
          <div id="lavatories"></div>
        </section>

        <section>
          <h2>Beverage cart</h2>
          <div id="beverageCart" class="selected-passenger"></div>
        </section>

        <section>
          <h2>Turbulence</h2>
          <div id="turbulence" class="selected-passenger"></div>
        </section>

        <section>
          <h2>Seed / config</h2>
          <pre id="config"></pre>
        </section>
      </aside>

      <section class="panel log-panel">
        <h2>Event log</h2>
        <ol id="eventLog"></ol>
      </section>
    </main>

    <script src="debugger.js"></script>
  </body>
</html>
